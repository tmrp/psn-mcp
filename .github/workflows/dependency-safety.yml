name: Dependency Safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Dependency policy and vulnerability review
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Use policy code/dependencies from the trusted base, never from the PR.
      - name: Checkout trusted policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install trusted policy dependencies without scripts
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify package sources, versions, age, signatures, publishers and scripts
        run: node trusted/.github/scripts/dependency-policy.cjs trusted candidate

      - name: Reject known vulnerabilities at any severity
        working-directory: candidate
        run: pnpm audit --audit-level low

      - name: Review newly introduced vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          retry-on-snapshot-warnings: true
