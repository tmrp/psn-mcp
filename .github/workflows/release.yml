name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded release runs on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm provenance / OIDC trusted publishing
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build Package
        run: pnpm build

      - name: Validate Package Contents
        run: pnpm pack --dry-run

      # On push to main, this either opens/updates a "Version Packages" PR
      # (when changesets are pending) or publishes to npm (once that PR is
      # merged and the changesets are consumed).
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version:packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Optional fallback when npm trusted publishing is not configured.
          # Configure npm trusted publishing for the psn-mcp package and this workflow.
          # NODE_AUTH_TOKEN requires an npm granular access token with publish permission.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Changesets can publish successfully while its locally created tag never
      # reaches GitHub. Reconcile the tag and release on every successful run.
      # Only operate on versions already present on npm, and never retarget a tag.
      - name: Synchronize published GitHub release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          published=$(npm view "psn-mcp@${version}" version --json 2>/dev/null || true)
          if [[ "${published//\"/}" != "${version}" ]]; then
            echo "Version ${version} is not confirmed on npm; skipping GitHub release."
            exit 0
          fi

          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_sha=$(git rev-list -n 1 "${tag}")
            if [[ "${tag_sha}" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Existing tag ${tag} points to ${tag_sha}, not HEAD. Refusing to retarget."
              exit 1
            fi
          else
            git tag "${tag}" HEAD
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists."
            exit 0
          fi

          # Use the version's existing changelog section as release notes.
          node --input-type=module <<'NODE' > /tmp/psn-mcp-release-notes.md
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## ${version}`;
          const start = changelog.indexOf(heading + '\n');
          if (start === -1) throw new Error(`Missing changelog entry for ${version}`);
          const from = start + heading.length + 1;
          const next = changelog.indexOf('\n## ', from);
          process.stdout.write(changelog.slice(from, next === -1 ? undefined : next).trim() + '\n');
          NODE
          gh release create "${tag}" --title "${tag}" --notes-file /tmp/psn-mcp-release-notes.md --verify-tag
