name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded release runs on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm provenance / OIDC trusted publishing
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create scoped release PR token
        if: vars.DEPENDABOT_AUTOMATION_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEPENDABOT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          # Later git pushes (the release sync step's tag push) use the App credential too.
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build Package
        run: pnpm build

      - name: Validate Package Contents
        run: pnpm pack --dry-run

      # On push to main, this either opens/updates a "Version Packages" PR
      # (when changesets are pending) or publishes to npm (once that PR is
      # merged and the changesets are consumed).
      # changesets/action v2 is required for @changesets/cli v3: v1 detects
      # publishes by parsing CLI v2 log output, so with CLI v3 it silently
      # skipped pushing tags and creating GitHub releases.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version:packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # App-created release PRs trigger CI; GITHUB_TOKEN-created PRs do not.
          # v2 only accepts the token through this input, not the GITHUB_TOKEN env var.
          github-token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true
          # Optional fallback when npm trusted publishing is not configured.
          # Configure npm trusted publishing for the psn-mcp package and this workflow.
          # NODE_AUTH_TOKEN requires an npm granular access token with publish permission.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Changesets can publish successfully while its locally created tag never
      # reaches GitHub. Reconcile the tag and release on every successful run.
      # Only operate on versions already present on npm, and never retarget a tag.
      # Skip version-PR runs: the action leaves the checkout on the unpublished
      # changeset-release branch, whose version is not on npm yet.
      - name: Synchronize published GitHub release
        if: ${{ success() && steps.changesets.outputs.has-changesets == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          # A just-published version can take a few minutes to show up in the
          # registry, so retry instead of skipping (which left releases missing).
          max_attempts=10
          for attempt in $(seq 1 "${max_attempts}"); do
            published=$(npm view "psn-mcp@${version}" version --json --prefer-online 2>/dev/null || true)
            if [[ "${published//\"/}" == "${version}" ]]; then
              break
            fi
            if (( attempt == max_attempts )); then
              echo "::error::Version ${version} is still not visible on npm; GitHub release ${tag} was not created."
              exit 1
            fi
            echo "Version ${version} is not visible on npm yet (attempt ${attempt}/${max_attempts}); retrying in 30s."
            sleep 30
          done

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists."
            exit 0
          fi
          # The action pushes a lightweight tag through the API while `changeset
          # publish` leaves an annotated local tag; let the remote tag win.
          git fetch --force origin --tags
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_sha=$(git rev-list -n 1 "${tag}")
            tagged_version=$(git show "${tag_sha}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [[ "${tagged_version}" != "${version}" ]]; then
              echo "::error::Existing tag ${tag} has package version ${tagged_version}. Refusing to retarget."
              exit 1
            fi
          else
            git tag "${tag}" HEAD
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists."
            exit 0
          fi

          # Use the version's existing changelog section as release notes.
          node --input-type=module <<'NODE' > /tmp/psn-mcp-release-notes.md
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## ${version}`;
          const start = changelog.indexOf(heading + '\n');
          if (start === -1) throw new Error(`Missing changelog entry for ${version}`);
          const from = start + heading.length + 1;
          const next = changelog.indexOf('\n## ', from);
          process.stdout.write(changelog.slice(from, next === -1 ? undefined : next).trim() + '\n');
          NODE
          gh release create "${tag}" --title "${tag}" --notes-file /tmp/psn-mcp-release-notes.md --verify-tag
