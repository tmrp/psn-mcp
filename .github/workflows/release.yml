name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded release runs on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm provenance / OIDC trusted publishing
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create scoped release PR token
        if: vars.DEPENDABOT_AUTOMATION_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEPENDABOT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          # Subsequent changesets git pushes must also use the App credential.
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build Package
        run: pnpm build

      - name: Validate Package Contents
        run: pnpm pack --dry-run

      # On push to main, this either opens/updates a "Version Packages" PR
      # (when changesets are pending) or publishes to npm (once that PR is
      # merged and the changesets are consumed).
      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version:packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # App-created release PRs trigger CI; GITHUB_TOKEN-created PRs do not.
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Optional fallback when npm trusted publishing is not configured.
          # Configure npm trusted publishing for the psn-mcp package and this workflow.
          # NODE_AUTH_TOKEN requires an npm granular access token with publish permission.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Changesets can publish successfully while its locally created tag never
      # reaches GitHub. Reconcile the tag and release on every successful run.
      # Only operate on versions already present on npm, and never retarget a tag.
      - name: Synchronize published GitHub release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          published=$(npm view "psn-mcp@${version}" version --json 2>/dev/null || true)
          if [[ "${published//\"/}" != "${version}" ]]; then
            echo "Version ${version} is not confirmed on npm; skipping GitHub release."
            exit 0
          fi

          git fetch origin --tags
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_sha=$(git rev-list -n 1 "${tag}")
            tagged_version=$(git show "${tag_sha}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [[ "${tagged_version}" != "${version}" ]]; then
              echo "::error::Existing tag ${tag} has package version ${tagged_version}. Refusing to retarget."
              exit 1
            fi
          else
            git tag "${tag}" HEAD
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists."
            exit 0
          fi

          # Use the version's existing changelog section as release notes.
          node --input-type=module <<'NODE' > /tmp/psn-mcp-release-notes.md
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## ${version}`;
          const start = changelog.indexOf(heading + '\n');
          if (start === -1) throw new Error(`Missing changelog entry for ${version}`);
          const from = start + heading.length + 1;
          const next = changelog.indexOf('\n## ', from);
          process.stdout.write(changelog.slice(from, next === -1 ? undefined : next).trim() + '\n');
          NODE
          gh release create "${tag}" --title "${tag}" --notes-file /tmp/psn-mcp-release-notes.md --verify-tag
