name: Dependabot Automation

on:
  workflow_run:
    workflows: [CI, Dependency Safety]
    types: [completed]

# This privileged workflow only runs main's scripts, never PR code/artifacts.
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: dependabot-automation
  cancel-in-progress: false

jobs:
  automate:
    if: vars.DEPENDABOT_AUTOMATION_APP_ID != '' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install trusted dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create scoped automation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DEPENDABOT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read

      - name: Add changeset or merge verified dependency/release PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const automate = require('./.github/scripts/dependabot-automation.cjs');
            await automate({ github, context, core });
